name: Build TaCZ 1.20.1

on:
  workflow_dispatch:
  push:
    branches:
      - "1.20.1"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download TaCZ source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build TaCZ
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload finished mod
        uses: actions/upload-artifact@v4
        with:
          name: TaCZ-compiled
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 7
          
